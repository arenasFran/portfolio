name: Portfolio CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-cicd
  cancel-in-progress: false

jobs:
  build-scan:
    name: Build & Security Scan (Trivy)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build imagen
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: portfolio:${{ github.sha }}

      - name: Escaneo Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: portfolio:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Guardar imagen escaneada
        run: docker save "portfolio:${GITHUB_SHA}" -o portfolio-image.tar

      - name: Subir imagen como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-image
          path: portfolio-image.tar
          retention-days: 1
          compression-level: 0

  quality:
    name: Análisis de calidad (SonarCloud)
    runs-on: ubuntu-latest
    needs: build-scan

    steps:
      - name: Checkout código completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Analizar código y verificar Quality Gate
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=600

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Simular tests
        run: echo "Tests pendientes — se implementan en el siguiente paso"

  publish:
    name: Publicar imagen en Docker Hub
    runs-on: ubuntu-latest
    needs: [build-scan, quality, test]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

    steps:
      - name: Descargar imagen escaneada
        uses: actions/download-artifact@v4
        with:
          name: portfolio-image

      - name: Cargar imagen Docker
        run: docker load --input portfolio-image.tar

      - name: Login a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publicar tags latest y SHA
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          docker tag "portfolio:${GITHUB_SHA}" \
            "${DOCKERHUB_USERNAME}/lab-github-actions:${GITHUB_SHA}"

          docker tag "portfolio:${GITHUB_SHA}" \
            "${DOCKERHUB_USERNAME}/lab-github-actions:latest"

          docker push "${DOCKERHUB_USERNAME}/lab-github-actions:${GITHUB_SHA}"
          docker push "${DOCKERHUB_USERNAME}/lab-github-actions:latest"

  deploy:
    name: Deploy a GitHub Pages
    runs-on: ubuntu-latest
    needs: [publish, quality, test]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Preparar archivos del portfolio
        run: |
          mkdir -p dist
          cp index.html style.css theme.js dist/

      - name: Subir artefacto de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
