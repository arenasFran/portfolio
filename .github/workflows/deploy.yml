name: Portfolio CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-cicd
  cancel-in-progress: false

jobs:
  build-scan-push:
    name: Build, Scan & Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build imagen
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: portfolio:${{ github.sha }}

      - name: Escaneo Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: portfolio:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Login a Docker Hub
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publicar imagen en Docker Hub
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          docker tag "portfolio:${GITHUB_SHA}" \
            "${DOCKERHUB_USERNAME}/lab-github-actions:${GITHUB_SHA}"

          docker tag "portfolio:${GITHUB_SHA}" \
            "${DOCKERHUB_USERNAME}/lab-github-actions:latest"

          docker push "${DOCKERHUB_USERNAME}/lab-github-actions:${GITHUB_SHA}"
          docker push "${DOCKERHUB_USERNAME}/lab-github-actions:latest"

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build-scan-push

    steps:
      - name: Simular tests
        run: echo "Tests pendientes — se implementan en el siguiente paso"

  deploy:
    name: Deploy a GitHub Pages
    runs-on: ubuntu-latest
    needs: [build-scan-push, test]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Preparar archivos del portfolio
        run: |
          mkdir -p dist
          cp index.html style.css theme.js dist/

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
