name: Pipeline DevOps

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-scan-push:
    name: Build, Scan & Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build imagen
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: lab-github-actions:${{ github.sha }}

      - name: Escaneo Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: lab-github-actions:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Login a Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Etiquetar y publicar imagen
        if: github.event_name != 'pull_request'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          docker tag "lab-github-actions:${GITHUB_SHA}" \
            "${DOCKERHUB_USERNAME}/lab-github-actions:${GITHUB_SHA}"

          docker tag "lab-github-actions:${GITHUB_SHA}" \
            "${DOCKERHUB_USERNAME}/lab-github-actions:latest"

          docker push "${DOCKERHUB_USERNAME}/lab-github-actions:${GITHUB_SHA}"
          docker push "${DOCKERHUB_USERNAME}/lab-github-actions:latest"

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build-scan-push

    steps:
      - name: Simular tests
        run: echo "Tests pendientes — se implementan en el siguiente paso"
